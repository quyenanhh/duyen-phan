<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:13px">
<div style="padding:14px;border-radius:8px;background:var(--cream-100);border:1px solid var(--border)"><div style="color:var(--text-body);font-weight:600">Ink trên kem</div><div style="color:var(--text-muted)">11,9:1 · 6,0:1</div></div>

<div style="padding:14px;border-radius:8px;background:var(--brand)"><div style="color:var(--text-on-brand);font-weight:600">Kem trên xanh</div><div style="color:#DCE6D6">7,4:1</div></div>
<div style="padding:14px;border-radius:8px;background:var(--clay-100)"><div style="color:var(--text-accent);font-weight:600">Nâu trên be</div><div style="color:var(--clay-700)">4,8:1</div></div>
</div>
</body></html>
