<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="Success · Warning · Info · Danger and their soft fills" -->
<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}</style></head><body>
<div style="display:flex;gap:12px"><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--success);border:1px solid rgba(46,42,34,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:600">success</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#4B6B3E</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--warning);border:1px solid rgba(46,42,34,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:600">warning</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#C98A2C</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--info);border:1px solid rgba(46,42,34,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:600">info</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#5C7A99</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--danger);border:1px solid rgba(46,42,34,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:600">danger</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#B4462E</div></div></div>
<div style="display:flex;gap:12px;margin-top:12px"><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--success-soft);border:1px solid rgba(46,42,34,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:600">success-soft</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#E7EEE2</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--warning-soft);border:1px solid rgba(46,42,34,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:600">warning-soft</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#F7E9CC</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--info-soft);border:1px solid rgba(46,42,34,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:600">info-soft</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#DFE7EF</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--danger-soft);border:1px solid rgba(46,42,34,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:600">danger-soft</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#F6DED7</div></div></div>
</body></html>
