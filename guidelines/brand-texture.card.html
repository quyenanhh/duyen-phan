<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}</style></head><body>
<div style="display:flex;gap:14px;height:120px">
<div style="flex:1;background:var(--cream-100);border:1px solid var(--border);border-radius:12px;display:grid;place-items:center;font-size:13px;color:var(--text-muted)">Trang · cream</div>
<div style="flex:1;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-card);display:grid;place-items:center;font-size:13px">Card · trắng</div>
<div style="flex:1;background:var(--surface-accent-soft);border:1px solid var(--clay-100);border-radius:12px;display:grid;place-items:center;font-size:13px;color:var(--text-accent)">Khối nhấn · clay</div>
<div style="flex:1;background:var(--surface-inverse);border-radius:12px;display:grid;place-items:center;font-size:13px;color:var(--cream-50)">Đảo màu · xanh đậm</div>
</div>
</body></html>
