<!-- @dsCard group="Brand" viewport="700x160" name="Iconography" subtitle="Lucide outline, 1.5px stroke, food & nature glyphs first" -->
<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}</style></head><body>
<div id="row" style="display:flex;gap:22px;flex-wrap:wrap;color:var(--text-brand)"></div>
<div style="margin-top:14px;font-size:12px;color:var(--text-muted)">Lucide 0.454 · stroke 1.5 · 20px mặc định · không dùng icon filled</div>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script>const names=['leaf','soup','utensils','sprout','truck','store','receipt-text','users','wallet','calendar-days','clock','package','chart-line','settings'];
document.getElementById('row').innerHTML=names.map(n=>'<i data-lucide="'+n+'" style="width:26px;height:26px"></i>').join('');
lucide.createIcons({attrs:{'stroke-width':1.5,width:26,height:26}});</script>
</body></html>
